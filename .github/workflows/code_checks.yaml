name: Code Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --prefer-dist
      - run: composer validate --strict --no-check-version
      - run: composer test
